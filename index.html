<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f2ea">
    <meta name="description" content="A Japanese-inspired desk calendar for Brussels.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日めくり">
    <script>
      try {
        if (localStorage.getItem("jdc-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
    <link rel="stylesheet" href="./styles.css?v=6">
    <link rel="stylesheet" href="./fonts/calendar-fonts.css?v=10">
    <title>Japanese Desk Calendar</title>
  </head>
  <body>
    <main class="calendar-sheet" aria-label="Japanese desk calendar for Brussels">
      <header class="masthead">
        <p class="edition"><strong>日々の暦</strong><span>DAILY CALENDAR · BRUSSELS</span></p>
        <p class="year" id="year">2026</p>
        <div class="masthead-tools">
          <div class="masthead-meta">
            <p class="timezone">欧州中央時間<br><span>EUROPE / BRUSSELS</span></p>
            <section class="light-control" aria-label="Light control">
              <span class="light-title"><b>照明</b><i>LIGHT</i></span>
              <button id="light-on" type="button" aria-pressed="false" disabled>ON</button>
              <button id="light-off" type="button" aria-pressed="false" disabled>OFF</button>
              <span class="light-status" id="light-status" aria-live="polite">—</span>
            </section>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Enable dark mode" aria-pressed="false">
            <span class="theme-sun" aria-hidden="true">☼</span>
            <span class="theme-moon" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <section class="weekday-panel" aria-label="Day of the week">
        <div class="weekday-ja" id="weekday-ja">水曜日</div>
        <div class="weekday-en" id="weekday-en">WEDNESDAY</div>
        <div class="rule" aria-hidden="true"></div>
        <p class="today-mark"><b>今日</b><span>TODAY</span></p>
        <p class="date-small" id="date-small">2 · SEPTEMBER</p>
      </section>

      <section class="hero-date" aria-label="Current day">
        <div class="sun-disc" aria-hidden="true"></div>
        <p class="day-number" id="day-number">2</p>
        <p class="hero-caption"><span>日</span> THE DAY, PRESENT AND UNREPEATED</p>
      </section>

      <aside class="month-panel" aria-label="Month and monthly calendar">
        <div class="month-heading">
          <div class="month-ja"><span id="month-number">9</span><small>月</small></div>
          <p id="month-en">SEPTEMBER</p>
        </div>
        <div class="month-rule" aria-hidden="true"></div>
        <div class="mini-calendar" id="mini-calendar"></div>
        <section class="weather" aria-label="Weather in Brussels">
          <div class="weather-title"><span>天気</span> WEATHER</div>
          <div class="weather-main">
            <strong id="weather-temp">--°</strong>
            <span id="weather-condition">UNAVAILABLE</span>
          </div>
          <dl class="weather-details">
            <div><dt>最高 / HIGH</dt><dd id="weather-high">--°</dd></div>
            <div><dt>最低 / LOW</dt><dd id="weather-low">--°</dd></div>
            <div><dt>風 / WIND</dt><dd id="weather-wind">-- km/h</dd></div>
          </dl>
          <p class="weather-status" id="weather-status" aria-live="polite"></p>
        </section>
      </aside>

      <footer class="time-band">
        <div class="location"><b>ブリュッセル</b><span>BRUSSELS · BELGIUM</span></div>
        <time class="clock" id="clock" datetime="00:00:00">00:00:00</time>
        <p class="clock-label">現在時刻<br><span>CURRENT TIME</span></p>
      </footer>
    </main>

    <noscript>This calendar needs JavaScript for live date, time, and weather.</noscript>
    <script type="module" src="./js/main.js?v=6"></script>
  </body>
</html>
